<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Виртуальная экскурсия по МИИГАиК</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>" />
  </head>
  <body>
    <div id="app">
      <!-- Контейнер панорамы WebGL Pannellum -->
      <div id="panorama"></div>

      <!-- Верхняя панель текущей локации -->
      <header class="top-bar">
        <div class="location-card">
          <h1 class="location-title" id="location-title">Загрузка экскурсии...</h1>
          <div class="location-floor" id="location-floor">Кампус МИИГАиК</div>
        </div>
        <div class="nav-actions">
          <button id="btn-toggle-drawer" class="btn-glass" type="button" aria-label="Открыть список сцен">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
            <span>Локации</span>
          </button>
        </div>
      </header>

      <!-- Выдвижная панель со списком локаций -->
      <aside class="drawer" id="scenes-drawer" aria-label="Список локаций">
        <div class="drawer-header">
          <span class="drawer-title">Точки маршрута</span>
          <button id="btn-close-drawer" class="btn-close" type="button" aria-label="Закрыть список">&times;</button>
        </div>
        <div class="drawer-content" id="scenes-list"></div>
      </aside>

      <!-- Модальное окно для информационных хотспотов -->
      <div class="modal-overlay" id="info-modal" role="dialog" aria-modal="true">
        <div class="modal-card">
          <h2 class="modal-title" id="info-modal-title"></h2>
          <p class="modal-body" id="info-modal-body"></p>
          <div class="modal-footer">
            <button id="btn-close-modal" class="btn-glass" type="button">Закрыть</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
