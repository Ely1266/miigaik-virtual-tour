<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Расписание занятий — вариант 2</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#182433}button,select{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #d97706;outline-offset:2px}button[aria-pressed=true]{font-weight:700}h1,h2,p{margin:0}main{margin:auto}.demo{font-size:12px;color:#536375}.empty{padding:20px;text-align:center}.today-tag{font-size:10px;display:block}.details{font-size:13px;color:#45566b}.status{font-weight:600}.cancel{text-decoration:line-through}
body{background:white;font-size:12px}main{max-width:960px;padding:8px}h1{font-size:18px;margin:0 0 4px}.demo{font-size:11px}.top{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:5px 0}.days{display:flex;gap:2px}.days button,#today,select{height:26px;border:1px solid #a7afb9;background:#f5f6f7;border-radius:2px;padding:1px 5px;font-size:12px}.days button[aria-pressed=true]{background:#cdd9e5}.today-tag{display:inline;font-size:9px}.toolbar{display:flex;gap:3px;align-items:center}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:580px;table-layout:auto}td,th{padding:4px;border:1px solid #d3d7dd;text-align:left;vertical-align:top}th{background:#eff1f3}td:first-child{white-space:nowrap}.now,.changed{background:#f6f6f6}.status{font-size:11px;font-weight:400;color:#4b5563}td button{padding:0;border:0;background:none;color:#205b9b;text-decoration:underline;text-align:left;font-size:12px}h2{font-size:14px;margin:6px 0}dialog{max-width:90vw;border:1px solid #9ca3af;padding:14px}dialog button{margin-top:12px}</style></head><body><main><header><h1>Расписание занятий</h1><p class="demo">Демонстрационные данные · условное время: понедельник, 11:00</p></header><div class="top"><nav class="days" id="days" aria-label="Дни недели"></nav><div class="toolbar"><label>Тип занятия <select id="filter"><option>Все</option><option>Лекция</option><option>Практика</option><option>Лабораторная</option></select></label><button id="today" type="button">Сегодня</button></div></div><h2 id="selected"></h2><div class="table-wrap"><table><thead><tr><th>Время</th><th>Дисциплина</th><th>Тип</th><th>Аудитория</th><th>Статус</th></tr></thead><tbody id="lessons"></tbody></table></div><dialog id="detail"><h2 id="detail-title"></h2><div id="detail-body"></div><form method="dialog"><button>Закрыть</button></form></dialog></main><script>const data={"Пн": [["09:00", "10:30", "Математический анализ", "Лекция", "301", "Главный", "И. А. Иванов", "", ""], ["10:40", "12:10", "Программирование", "Практика", "205", "Главный", "А. В. Петров", "", "Принести ноутбук."], ["12:30", "14:00", "Картография", "Лабораторная", "408", "Учебный", "Е. С. Смирнова", "Перенесено", "Начало перенесено с 12:10 на 12:30."], ["14:10", "15:40", "Геодезия", "Лекция", "110", "Главный", "М. Н. Соколов", "Отменено", "Занятие отменено."]], "Вт": [["09:00", "10:30", "Информатика", "Лекция", "302", "Главный", "А. В. Петров", "", ""], ["10:40", "12:10", "Геодезия", "Практика", "212", "Учебный", "М. Н. Соколов", "Замена аудитории", "Ранее аудитория 210."]], "Ср": [["12:30", "14:00", "Картография", "Практика", "408", "Учебный", "Е. С. Смирнова", "", ""]], "Чт": [], "Пт": null, "Сб": [["09:00", "10:30", "Геодезия", "Лабораторная", "115", "Главный", "М. Н. Соколов", "", ""]], "Вс": []};const today='Пн', now='11:00';let day=today, filter='Все';const days=document.querySelector('#days'),list=document.querySelector('#lessons');
const isNow=x=>day===today && x[0]<=now && now<x[1] && x[7]!=='Отменено';
const dayNames={'Пн':'Понедельник','Вт':'Вторник','Ср':'Среда','Чт':'Четверг','Пт':'Пятница','Сб':'Суббота','Вс':'Воскресенье'};
for(const d of Object.keys(data)){const b=document.createElement('button');b.type='button';b.dataset.day=d;b.innerHTML=d+(d===today?'<span class="today-tag">сегодня</span>':'');b.setAttribute('aria-label',dayNames[d]+(d===today?', сегодня':''));b.onclick=()=>{day=d;render()};days.append(b)}
function render(){for(const b of days.children)b.setAttribute('aria-pressed',String(b.dataset.day===day));document.querySelector('#selected').textContent=dayNames[day];const records=data[day];const shown=(records||[]).filter(x=>filter==='Все'||x[3]===filter).sort((a,b)=>a[0].localeCompare(b[0]));list.innerHTML='';if(!shown.length){const msg=records===null?'Расписание ещё не загружено':records.length===0?'Нет занятий':'Нет занятий выбранного типа';list.innerHTML='<tr><td colspan=5 class=empty>'+msg+'</td></tr>';return;}for(const x of shown){const active=isNow(x), status=[active?'Идёт сейчас':'',x[7]].filter(Boolean).join(' · '),className=(active?'now ':'')+(x[7]?'changed':'');const tr=document.createElement('tr');tr.className=className;tr.innerHTML=`<td>${x[0]}–${x[1]}</td><td><button type="button" class="${x[7]==='Отменено'?'cancel':''}">${x[2]}</button></td><td>${x[3]}</td><td>${x[4]}</td><td class="status">${status||'—'}</td>`;tr.querySelector('button').onclick=()=>{document.querySelector('#detail-title').textContent=x[2];document.querySelector('#detail-body').innerHTML=`<p>Преподаватель: ${x[6]}</p><p>Корпус: ${x[5]}</p><p>Аудитория: ${x[4]}</p><p>${x[8]||'Примечаний нет'}</p>`;document.querySelector('#detail').showModal()};list.append(tr);}}
document.querySelector('#today').onclick=()=>{day=today;render()};document.querySelector('#filter').onchange=e=>{filter=e.target.value;render()};render();</script></body></html>
