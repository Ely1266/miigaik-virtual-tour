<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Расписание занятий — вариант 3</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#182433}button,select{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #d97706;outline-offset:2px}button[aria-pressed=true]{font-weight:700}h1,h2,p{margin:0}main{margin:auto}.demo{font-size:12px;color:#536375}.empty{padding:20px;text-align:center}.today-tag{font-size:10px;display:block}.details{font-size:13px;color:#45566b}.status{font-weight:600}.cancel{text-decoration:line-through}
body{background:#eef2f7}main{max-width:660px;padding:20px}header{margin-bottom:18px}h1{font-size:26px;margin-bottom:6px}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.days button,#today,select{min-height:48px;border-radius:10px;border:1px solid #bdc9d8;background:#fff;color:#172a42;font-size:14px}.days button{padding:4px 0}.days button[aria-pressed=true]{background:#254c83;color:#fff}.today-tag{font-size:9px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 24px}.toolbar label{display:grid;gap:4px;font-size:12px}.toolbar select{width:100%;padding:0 10px}#today{align-self:end;background:#214d86;color:white;font-weight:700}h2{font-size:18px;margin-bottom:12px}.lesson{background:white;border:1px solid #d5dee9;border-radius:13px;margin:0 0 14px;padding:15px}.lesson.now{border:2px solid #157453;background:#f2faf5}.time{font-size:14px;font-weight:600;color:#405776}.lesson h3{margin:7px 0 3px;font-size:17px}.meta{font-size:14px;color:#475569}.status{display:inline-block;margin-top:10px;border-radius:6px;padding:5px 8px;background:#ffefd5;color:#783d08;font-size:12px}.now .status{background:#176a49;color:white}.lesson details{margin-top:8px}.lesson summary{min-height:44px;display:flex;align-items:center;color:#244e87;cursor:pointer;border-top:1px solid #e0e5ee}.lesson summary::before{content:'▸';margin-right:8px}.lesson details[open] summary::before{content:'▾'}.details p{margin:5px 0}@media(max-width:400px){main{padding:12px}.days{gap:4px}.days button{font-size:13px}.today-tag{font-size:8px}}</style></head><body><main><header><h1>Расписание занятий</h1><p class="demo">Демонстрационные данные · условное время: понедельник, 11:00</p></header><div class="top"><nav class="days" id="days" aria-label="Дни недели"></nav><div class="toolbar"><label>Тип занятия <select id="filter"><option>Все</option><option>Лекция</option><option>Практика</option><option>Лабораторная</option></select></label><button id="today" type="button">Сегодня</button></div></div><h2 id="selected"></h2><section id="lessons" aria-label="Список занятий"></section></main><script>const data={"Пн": [["09:00", "10:30", "Математический анализ", "Лекция", "301", "Главный", "И. А. Иванов", "", ""], ["10:40", "12:10", "Программирование", "Практика", "205", "Главный", "А. В. Петров", "", "Принести ноутбук."], ["12:30", "14:00", "Картография", "Лабораторная", "408", "Учебный", "Е. С. Смирнова", "Перенесено", "Начало перенесено с 12:10 на 12:30."], ["14:10", "15:40", "Геодезия", "Лекция", "110", "Главный", "М. Н. Соколов", "Отменено", "Занятие отменено."]], "Вт": [["09:00", "10:30", "Информатика", "Лекция", "302", "Главный", "А. В. Петров", "", ""], ["10:40", "12:10", "Геодезия", "Практика", "212", "Учебный", "М. Н. Соколов", "Замена аудитории", "Ранее аудитория 210."]], "Ср": [["12:30", "14:00", "Картография", "Практика", "408", "Учебный", "Е. С. Смирнова", "", ""]], "Чт": [], "Пт": null, "Сб": [["09:00", "10:30", "Геодезия", "Лабораторная", "115", "Главный", "М. Н. Соколов", "", ""]], "Вс": []};const today='Пн', now='11:00';let day=today, filter='Все';const days=document.querySelector('#days'),list=document.querySelector('#lessons');
const isNow=x=>day===today && x[0]<=now && now<x[1] && x[7]!=='Отменено';
const dayNames={'Пн':'Понедельник','Вт':'Вторник','Ср':'Среда','Чт':'Четверг','Пт':'Пятница','Сб':'Суббота','Вс':'Воскресенье'};
for(const d of Object.keys(data)){const b=document.createElement('button');b.type='button';b.dataset.day=d;b.innerHTML=d+(d===today?'<span class="today-tag">сегодня</span>':'');b.setAttribute('aria-label',dayNames[d]+(d===today?', сегодня':''));b.onclick=()=>{day=d;render()};days.append(b)}
function render(){for(const b of days.children)b.setAttribute('aria-pressed',String(b.dataset.day===day));document.querySelector('#selected').textContent=dayNames[day];const records=data[day];const shown=(records||[]).filter(x=>filter==='Все'||x[3]===filter).sort((a,b)=>a[0].localeCompare(b[0]));list.innerHTML='';if(!shown.length){const msg=records===null?'Расписание ещё не загружено':records.length===0?'Нет занятий':'Нет занятий выбранного типа';list.innerHTML='<p class=empty>'+msg+'</p>';return;}for(const x of shown){const active=isNow(x), status=[active?'Идёт сейчас':'',x[7]].filter(Boolean).join(' · '),className=(active?'now ':'')+(x[7]?'changed':'');const a=document.createElement('article');a.className='lesson '+className;a.innerHTML=`<div class="time">${x[0]}–${x[1]}</div><div><h3 class="${x[7]==='Отменено'?'cancel':''}">${x[2]}</h3><p class="meta">${x[3]} · ауд. ${x[4]} · ${x[5]}</p>${status?`<p class="status">${status}</p>`:''}<details><summary>Подробнее</summary><div class="details"><p>Преподаватель: ${x[6]}</p><p>Корпус: ${x[5]}</p><p>${x[8]||'Примечаний нет'}</p></div></details></div>`;list.append(a);}}
document.querySelector('#today').onclick=()=>{day=today;render()};document.querySelector('#filter').onchange=e=>{filter=e.target.value;render()};render();</script></body></html>
