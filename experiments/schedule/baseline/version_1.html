<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Расписание занятий — вариант 1</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#182433}button,select{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #d97706;outline-offset:2px}button[aria-pressed=true]{font-weight:700}h1,h2,p{margin:0}main{margin:auto}.demo{font-size:12px;color:#536375}.empty{padding:20px;text-align:center}.today-tag{font-size:10px;display:block}.details{font-size:13px;color:#45566b}.status{font-weight:600}.cancel{text-decoration:line-through}
body{background:#f2f5f9}main{max-width:830px;padding:24px;background:white;border-radius:14px;margin:20px auto}h1{font-size:25px;margin-bottom:6px}.days{display:flex;gap:6px;overflow-x:auto;padding:12px 2px}.days button,.toolbar button,select{min-height:40px;border:1px solid #becbd9;background:#fff;color:#182433;padding:7px 12px;border-radius:7px}.days button[aria-pressed=true],#today{background:#175ea8;color:white}.toolbar{display:flex;gap:10px;align-items:center;margin:12px 0 18px;flex-wrap:wrap}.toolbar label{font-size:14px}.lesson{display:grid;grid-template-columns:110px 1fr;gap:10px;margin:10px 0;border:1px solid #d3dfea;border-radius:9px;padding:12px}.lesson h3{font-size:16px;margin:0 0 4px}.meta{font-size:13px;color:#536375}.lesson .status{font-size:13px;color:#8b4504}.lesson.now{border-left:4px solid #16856b}.lesson.now .status{color:#0e5943}.lesson summary{font-size:13px;cursor:pointer;color:#175ea8;margin-top:6px}.lesson details p{margin:4px 0}h2{font-size:18px}@media(max-width:560px){main{margin:0;padding:15px;border-radius:0}.lesson{grid-template-columns:1fr}.days button{padding:6px 9px}}</style></head><body><main><header><h1>Расписание занятий</h1><p class="demo">Демонстрационные данные · условное время: понедельник, 11:00</p></header><div class="top"><nav class="days" id="days" aria-label="Дни недели"></nav><div class="toolbar"><label>Тип занятия <select id="filter"><option>Все</option><option>Лекция</option><option>Практика</option><option>Лабораторная</option></select></label><button id="today" type="button">Сегодня</button></div></div><h2 id="selected"></h2><section id="lessons" aria-label="Список занятий"></section></main><script>const data={"Пн": [["09:00", "10:30", "Математический анализ", "Лекция", "301", "Главный", "И. А. Иванов", "", ""], ["10:40", "12:10", "Программирование", "Практика", "205", "Главный", "А. В. Петров", "", "Принести ноутбук."], ["12:30", "14:00", "Картография", "Лабораторная", "408", "Учебный", "Е. С. Смирнова", "Перенесено", "Начало перенесено с 12:10 на 12:30."], ["14:10", "15:40", "Геодезия", "Лекция", "110", "Главный", "М. Н. Соколов", "Отменено", "Занятие отменено."]], "Вт": [["09:00", "10:30", "Информатика", "Лекция", "302", "Главный", "А. В. Петров", "", ""], ["10:40", "12:10", "Геодезия", "Практика", "212", "Учебный", "М. Н. Соколов", "Замена аудитории", "Ранее аудитория 210."]], "Ср": [["12:30", "14:00", "Картография", "Практика", "408", "Учебный", "Е. С. Смирнова", "", ""]], "Чт": [], "Пт": null, "Сб": [["09:00", "10:30", "Геодезия", "Лабораторная", "115", "Главный", "М. Н. Соколов", "", ""]], "Вс": []};const today='Пн', now='11:00';let day=today, filter='Все';const days=document.querySelector('#days'),list=document.querySelector('#lessons');
const isNow=x=>day===today && x[0]<=now && now<x[1] && x[7]!=='Отменено';
const dayNames={'Пн':'Понедельник','Вт':'Вторник','Ср':'Среда','Чт':'Четверг','Пт':'Пятница','Сб':'Суббота','Вс':'Воскресенье'};
for(const d of Object.keys(data)){const b=document.createElement('button');b.type='button';b.dataset.day=d;b.innerHTML=d+(d===today?'<span class="today-tag">сегодня</span>':'');b.setAttribute('aria-label',dayNames[d]+(d===today?', сегодня':''));b.onclick=()=>{day=d;render()};days.append(b)}
function render(){for(const b of days.children)b.setAttribute('aria-pressed',String(b.dataset.day===day));document.querySelector('#selected').textContent=dayNames[day];const records=data[day];const shown=(records||[]).filter(x=>filter==='Все'||x[3]===filter).sort((a,b)=>a[0].localeCompare(b[0]));list.innerHTML='';if(!shown.length){const msg=records===null?'Расписание ещё не загружено':records.length===0?'Нет занятий':'Нет занятий выбранного типа';list.innerHTML='<p class=empty>'+msg+'</p>';return;}for(const x of shown){const active=isNow(x), status=[active?'Идёт сейчас':'',x[7]].filter(Boolean).join(' · '),className=(active?'now ':'')+(x[7]?'changed':'');const a=document.createElement('article');a.className='lesson '+className;a.innerHTML=`<div class="time">${x[0]}–${x[1]}</div><div><h3 class="${x[7]==='Отменено'?'cancel':''}">${x[2]}</h3><p class="meta">${x[3]} · ауд. ${x[4]} · ${x[5]}</p>${status?`<p class="status">${status}</p>`:''}<details><summary>Подробнее</summary><div class="details"><p>Преподаватель: ${x[6]}</p><p>Корпус: ${x[5]}</p><p>${x[8]||'Примечаний нет'}</p></div></details></div>`;list.append(a);}}
document.querySelector('#today').onclick=()=>{day=today;render()};document.querySelector('#filter').onchange=e=>{filter=e.target.value;render()};render();</script></body></html>
