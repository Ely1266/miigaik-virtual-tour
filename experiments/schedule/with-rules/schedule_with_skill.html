<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Расписание занятий</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17263b;font:16px/1.45 system-ui,sans-serif}main{max-width:720px;margin:auto;padding:20px}h1,h2,h3,p{margin:0}h1{font-size:26px}h2{font-size:20px}header{margin-bottom:24px}.demo{font-size:12px;color:#475569;margin-top:4px}button,select{font:inherit;color:inherit}button,select,summary{cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #a64b00;outline-offset:2px}.controls{background:#fff;border:1px solid #d5dce6;border-radius:12px;padding:12px;margin-bottom:24px}.days{display:grid;grid-template-columns:repeat(7,minmax(44px,1fr));gap:6px}button,select{border:1px solid #9eabbc;background:#fff;border-radius:8px;min-width:44px;min-height:48px}.days button{font-size:14px;padding:4px 0}.days button[aria-pressed=true]{border:2px solid #1e4475;font-weight:700;color:#1e4475;background:#eef4fc}.day-label{display:block;font-size:10px}.actions{display:grid;grid-template-columns:1fr 1.25fr;gap:12px;align-items:end;margin-top:16px}.actions label{display:grid;gap:4px;font-size:13px;min-width:0}.actions select{width:100%;padding:0 6px;font-size:14px}#today{height:52px;background:#1e4475;border-color:#1e4475;color:white;font-weight:700}.heading{margin-bottom:12px}.lesson{margin:0 0 16px;border:1px solid #d5dce6;border-radius:12px;background:#fff;overflow-wrap:anywhere}.lesson.now{border:2px solid #19724d;background:#eff9f2}.lesson summary{display:block;position:relative;min-height:48px;padding:14px 42px 14px 14px;list-style:none}.lesson summary::-webkit-details-marker{display:none}.lesson summary:after{content:'▾';position:absolute;right:16px;top:16px;color:#1e4475;font-size:18px}.lesson details[open] summary:after{content:'▴'}.time{font-weight:700;font-size:14px;color:#344963}.lesson h3{font-size:17px;margin:4px 0}.meta{font-size:14px;color:#43546a}.status{display:inline-block;margin-top:6px;padding:3px 8px;font-size:13px;font-weight:650;max-width:100%}.current{background:#166442;color:white;border-radius:5px}.change{background:#fff3db;border:1px dashed #875005;border-radius:0;color:#724204}.cancel{text-decoration:line-through}.more{margin-top:8px;font-size:13px;color:#244e87;font-weight:600}.details{padding:12px 14px;border-top:1px solid #d5dce6;font-size:14px}.details p+p{margin-top:4px}.empty{background:white;border:1px solid #d5dce6;padding:20px;border-radius:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}@media(max-width:500px){main{padding:12px}.days{grid-template-columns:repeat(4,minmax(44px,1fr))}}@media(max-width:360px){.actions{grid-template-columns:1fr}#today{width:100%}}
</style></head><body><main><header><h1>Расписание занятий</h1><p class="demo">Демонстрационные данные · условное время: понедельник, 11:00</p></header>
<section class="controls" aria-label="Выбор расписания"><nav class="days" id="days" aria-label="Дни недели"></nav><div class="actions"><label for="filter">Тип занятия<select id="filter"><option>Все</option><option>Лекция</option><option>Практика</option><option>Лабораторная</option></select></label><button id="today" type="button">Сегодня</button></div></section>
<div class="heading"><h2 id="selected"></h2><p class="sr-only" id="feedback" role="status"></p></div><section id="lessons" aria-labelledby="selected"></section></main>
<script>
const data={"Пн": [["09:00", "10:30", "Математический анализ", "Лекция", "301", "Главный", "И. А. Иванов", "", ""], ["10:40", "12:10", "Программирование", "Практика", "205", "Главный", "А. В. Петров", "", "Принести ноутбук."], ["12:30", "14:00", "Картография", "Лабораторная", "408", "Учебный", "Е. С. Смирнова", "Перенесено", "Начало перенесено с 12:10 на 12:30."], ["14:10", "15:40", "Геодезия", "Лекция", "110", "Главный", "М. Н. Соколов", "Отменено", "Занятие отменено."]], "Вт": [["09:00", "10:30", "Информатика", "Лекция", "302", "Главный", "А. В. Петров", "", ""], ["10:40", "12:10", "Геодезия", "Практика", "212", "Учебный", "М. Н. Соколов", "Замена аудитории", "Ранее аудитория 210."]], "Ср": [["12:30", "14:00", "Картография", "Практика", "408", "Учебный", "Е. С. Смирнова", "", ""]], "Чт": [], "Пт": null, "Сб": [["09:00", "10:30", "Геодезия", "Лабораторная", "115", "Главный", "М. Н. Соколов", "", ""]], "Вс": []};
const today='Пн',now='11:00';const names={'Пн':'Понедельник','Вт':'Вторник','Ср':'Среда','Чт':'Четверг','Пт':'Пятница','Сб':'Суббота','Вс':'Воскресенье'};
let day=today;const days=document.querySelector('#days'), list=document.querySelector('#lessons'),filter=document.querySelector('#filter');
for(const d of Object.keys(data)){const b=document.createElement('button');b.type='button';b.dataset.day=d;b.innerHTML=d+(d===today?'<span class="day-label">сегодня</span>':'');b.setAttribute('aria-label',names[d]+(d===today?', сегодня':''));if(d===today)b.setAttribute('aria-current','date');b.addEventListener('click',()=>{day=d;render()});days.append(b)}
function render(){for(const b of days.children)b.setAttribute('aria-pressed',String(b.dataset.day===day));document.querySelector('#selected').textContent=names[day];const records=data[day];const shown=(records||[]).filter(x=>filter.value==='Все'||x[3]===filter.value).sort((a,b)=>a[0].localeCompare(b[0]));list.replaceChildren();let msg='';if(!shown.length){msg=records===null?'Расписание ещё не загружено':records.length===0?'Нет занятий':'Нет занятий выбранного типа';const p=document.createElement('p');p.className='empty';p.textContent=msg;list.append(p)}
for(const x of shown){const active=day===today&&x[0]<=now&&now<x[1]&&x[7]!=='Отменено';const a=document.createElement('article');a.className='lesson'+(active?' now':'')+(x[7]?' changed':'');a.innerHTML=`<details><summary><div class="time">${x[0]}–${x[1]}</div><h3 class="${x[7]==='Отменено'?'cancel':''}">${x[2]}</h3><p class="meta">${x[3]} · ауд. ${x[4]} · ${x[5]}</p>${active?'<span class="status current">Идёт сейчас</span>':''}${x[7]?`<span class="status change">${x[7]}</span>`:''}<p class="more">Подробнее</p></summary><div class="details"><p>Преподаватель: ${x[6]}</p><p>Корпус: ${x[5]}</p><p>${x[8]||'Примечаний нет'}</p></div></details>`;list.append(a)}document.querySelector('#feedback').textContent=names[day]+': '+(msg||shown.length+' занятий')}
filter.addEventListener('change',render);document.querySelector('#today').addEventListener('click',()=>{day=today;render()});render();
</script></body></html>
